[project]
name = "hterm"
version = "0.1.0"
description = "Raycast extension for launching common herdr workspaces"
authors = [
    {name = "Frank Wiles"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15.1",
    "rich>=13.9.4",
    "textual>=2.1.2",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.6",
    "ty>=0.0.1a6",
    "pre-commit>=4.1.0",
    "textual-dev>=1.7.0",
]

[project.scripts]
hterm = "hterm.cli.app:app"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["hterm"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ty.environment]
python-version = "3.14"
