id = "hterm.finder"
name = "hterm Project Finder"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Filter hterm projects with fzf and open one from a Herdr popup"
platforms = ["macos"]

[[actions]]
id = "open"
title = "Find an hterm project"
contexts = ["workspace"]
command = ["/bin/sh", "open-picker.sh"]

[[panes]]
id = "picker"
title = "hterm projects"
placement = "popup"
width = "80%"
height = "70%"
command = ["/bin/sh", "picker.sh"]
